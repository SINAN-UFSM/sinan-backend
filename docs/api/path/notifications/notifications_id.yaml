# ENDPOINT: /notifications/{id}

# --- GET METHOD ---
get:
  summary: Consultar notificação por ID (Polimórfico)
  tags:
    - Notificações (Geral)
  operationId: consultarNotificacaoPorID
  parameters:
    - $ref: "../components/parameters.yaml#/PathUuid"
  responses:
    "200":
      description: Notificação retornada com sucesso.
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/PolymorphicNotificationResponse"
    "404":
      $ref: "../components/errors.yaml#/responses/404"
    "500":
      $ref: "../components/errors.yaml#/responses/500"

# --- PATCH METHOD ---
patch:
  summary: Atualizar notificação por ID (Polimórfico)
  tags:
    - Notificações (Geral)
  operationId: atualizarNotificacaoPorID
  parameters:
    - $ref: "../components/parameters.yaml#/PathUuid"
  requestBody:
    description: Dados parciais da notificação a serem atualizados.
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yaml#/UpdateNotificationRequest"
  responses:
    "200":
      description: Notificação atualizada com sucesso.
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/PolymorphicNotificationResponse"
    "400":
      $ref: "../components/errors.yaml#/responses/400"
    "404":
      $ref: "../components/errors.yaml#/responses/404"
    "500":
      $ref: "../components/errors.yaml#/responses/500"

# --- DELETE METHOD ---
delete:
  summary: Excluir notificação por ID
  tags:
    - Notificações (Geral)
  operationId: excluirNotificacaoPorID
  parameters:
    - $ref: "../components/parameters.yaml#/PathUuid"
  responses:
    "204":
      description: Notificação excluída com sucesso.
    "404":
      $ref: "../components/errors.yaml#/responses/404"
    "500":
      $ref: "../components/errors.yaml#/responses/500"
