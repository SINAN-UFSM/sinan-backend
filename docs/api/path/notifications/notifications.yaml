# ENDPOINT: /notifications

# --- GET METHOD ---
get:
  summary: Listar notificações no sistema SINAN.
  description: Retorna uma lista com todas as notificações cadastradas no sistema.
  tags:
    - Notificações (Geral)
  operationId: listarNotificacoes
  parameters:
    - $ref: "../components/parameters.yaml#/PageParam"
    - $ref: "../components/parameters.yaml#/LimitParam" # Ajustado
    - $ref: "../components/parameters.yaml#/PatientIDParam" # Já definimos como UUID no arquivo de params
    - name: notificationTypeSlug
      in: query
      required: false
      description: Filtrar por tipo de agravo.
      schema:
        type: string
        example: "botulism"
  responses:
    "200":
      description: Lista de notificações retornada com sucesso.
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/PaginatedNotificationList"
    "401":
      $ref: "../components/errors.yaml#/responses/401"
    "500":
      $ref: "../components/errors.yaml#/responses/500"

# --- POST METHOD ---
post:
  summary: Criar nova notificação (Polimórfico)
  description: Cria uma nova notificação. O payload deve conter o `notificationTypeSlug`.
  tags:
    - Notificações (Geral)
  operationId: criarNotificacao
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yaml#/CreateNotificationRequest"
  responses:
    "201":
      description: Notificação criada com sucesso.
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/PolymorphicNotificationResponse"
    "400":
      $ref: "../components/errors.yaml#/responses/400"
    "401":
      $ref: "../components/errors.yaml#/responses/401"
    "500":
      $ref: "../components/errors.yaml#/responses/500"
