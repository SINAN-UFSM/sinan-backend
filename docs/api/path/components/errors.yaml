# --- BASE ---
BaseError:
  type: object
  required: [error]
  properties:
    error:
      type: string
      description: "Mensagem descritiva do erro."
      example: "Resource not found"

# --- 400s ---
BadRequestError:
  allOf:
    - $ref: "#/BaseError"
    - type: object
      properties:
        details:
          type: array
          description: "Lista de erros de validação de campos (retornado pelo Zod)."
          items:
            type: object
            properties:
              field:
                type: string
                description: "Caminho/nome do campo com erro."
                example: "cpf"
              message:
                type: string
                description: "Motivo da falha de validação."
                example: "Invalid CPF"

UnauthorizedError: # 401
  allOf:
    - $ref: "#/BaseError"

PaymentRequiredError: # 402
  allOf:
    - $ref: "#/BaseError"

ForbiddenError: # 403
  allOf:
    - $ref: "#/BaseError"

NotFoundError: # 404
  allOf:
    - $ref: "#/BaseError"

UnprocessableEntityError:
  allOf:
    - $ref: "#/BaseError"

# --- 500s ---
InternalServerError: # 500
  allOf:
    - $ref: "#/BaseError"

responses:
  "400":
    description: "Bad Request - Erro na sintaxe da requisição ou falha de validação (Zod/Domain)."
    content:
      application/json:
        schema:
          $ref: "#/BadRequestError"
        example:
          error: "Validation error"
          details:
            - field: "susCard"
              message: "Invalid SUS Card"
  "401":
    description: "Unauthorized - Credenciais inválidas ou ausentes."
    content:
      application/json:
        schema:
          $ref: "#/UnauthorizedError"
        example:
          error: "Invalid token"
  "402":
    description: "Payment Required - Pagamento necessário para acessar o recurso."
    content:
      application/json:
        schema:
          $ref: "#/PaymentRequiredError"
  "403":
    description: "Forbidden - Acesso negado por falta de privilégios."
    content:
      application/json:
        schema:
          $ref: "#/ForbiddenError"
        example:
          error: "Admin privileges required"
  "404":
    description: "Not Found - O recurso não existe."
    content:
      application/json:
        schema:
          $ref: "#/NotFoundError"
        example:
          error: "Patient not found"
  "422":
    description: "Unprocessable Entity - Erro de regra de negócio."
    content:
      application/json:
        schema:
          $ref: "#/UnprocessableEntityError"
  "500":
    description: "Internal Server Error - Erro interno do servidor."
    content:
      application/json:
        schema:
          $ref: "#/InternalServerError"
        example:
          error: "Internal server error"
