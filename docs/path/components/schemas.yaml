# --- PATIENT SCHEMA ---
PatientBase:
  type: object
  required:
    - name
    - document
    - birth_date
    - birth_city
    - sus_card
    - race_color
    - gender
    - education_level
  properties:
    name:
      type: string
      description: Nome completo do paciente.
      example: "João da Silva"
    document:
      type: string
      description: CPF válido (apenas números).
      example: "12345678900"
      pattern: "^[0-9]{11}$"
    sus_card:
      type: string
      description: Número do cartão SUS do paciente.
      example: "^[0-9]{15}$"
    birth_date:
      type: string
      format: date
      description: Data de nascimento do paciente.
      example: "1990-05-15"
    birth_city:
      type: string
      description: Cidade de nascimento do paciente.
      example: "Rio de Janeiro"
    phone:
      type: string
      nullable: true
      description: Número de telefone do paciente (opcional).
      example: "+55 11 91234-5678"
    gender:
      type: string
      description: Gênero do paciente.
      example: "Masculino"
    education_level:
      type: string
      description: Nível de escolaridade do paciente.
      example: "Superior Completo"
    race_color:
      type: string
      description: Raça/cor autodeclarada do paciente.
      example: "Branca"
    current_address:
      type: string
      nullable: true
      description: Endereço atual do paciente (opcional).
      example: "Rua das Flores, 123, Bairro Jardim, São Paulo - SP"

PatientResponse:
  allOf:
    - $ref: "#/PatientBase"
    - type: object
      required:
        - id
      properties:
        id:
          type: integer
          description: ID único do paciente.
          example: 105
        is_active:
          type: boolean
          description: Indica se o paciente está ativo no cadastro lógico.
          example: true

PatientCreateRequest:
  allOf:
    - $ref: "#/PatientBase"

PatientUpdateRequest:
  allOf:
    - $ref: "#/PatientBase"

# --- UNITS SCHEMA ---
UnitBase:
  type: object
  required:
    - name
    - city
    - state
  properties:
    name:
      type: string
      description: Nome oficial da unidade de saúde.
      example: "UPA 24h - Centro"
    city:
      type: string
      description: Cidade onde a unidade está localizada.
      example: "São Paulo"
    state:
      type: string
      description: Estado onde a unidade está localizada (sigla).
      example: "SP"

UnitResponse:
  allOf:
    - $ref: "#/UnitBase"
    - type: object
      properties:
        id:
          type: integer
          description: ID único da unidade (gerado pelo banco).
          example: 12
        is_active:
          type: boolean
          description: Indica se a unidade está ativa no cadastro lógico.
          example: true

UnitCreateRequest:
  allOf:
    - $ref: "#/UnitBase"

PaginatedUnitList:
  type: object
  properties:
    count:
      type: integer
      description: Total de unidades cadastradas.
      example: 45230
    next:
      type: string
      nullable: true
      example: "http://localhost:8000/api/v1/units/?page=2"
    previous:
      type: string
      nullable: true
      example: null
    results:
      type: array
      items:
        $ref: "#/UnitResponse"

# --- NOTIFICATION BASE SCHEMA ---
NotificationBase:
  type: object
  required:
    - patient_id
    - unit_id
    - status
    - notification_date
    - occurrence_date
    - notification_type_slug
  properties:
    patient_id:
      type: integer
      description: ID do paciente.
      example: 55
    unit_id:
      type: integer
      description: ID da unidade de saúde.
      example: 12
    user_id:
      type: integer
      readOnly: true
      description: ID do usuário responsável pelo registro (definido pelo backend).
      example: 7
    status:
      type: string
      description: Status atual da notificação.
      example: "draft"
    notification_type_slug:
      type: string
      description: Identificador do agravo.
      example: "dengue"
    notification_date:
      type: string
      format: date
      description: Data da notificação.
      example: "2026-06-25"
    occurrence_date:
      type: string
      format: date
      description: Data da ocorrência.
      example: "2026-06-20"
    notes:
      type: string
      nullable: true
      description: Observações adicionais sobre a notificação.
      example: "Paciente internado."

CreateNotificationRequest:
  description: Requisição para criar uma nova notificação.
  oneOf:
    - $ref: "#/DengueCreateRequest"
  discriminator:
    propertyName: notification_type_slug
    mapping:
      dengue: "#/DengueCreateRequest"

PolymorphicNotificationResponse:
  description: Resposta dinâmica retornada após a criação da notificação.
  oneOf:
    - $ref: "#/DengueNotificationResponse"
  discriminator:
    propertyName: notification_type_slug
    mapping:
      dengue: "#/DengueNotificationResponse"

# --- NOTIFICATION RESPONSE SCHEMA ---
NotificationResponse:
  allOf:
    - $ref: "#/NotificationBase"
    - type: object
      properties:
        id:
          type: integer
          description: ID único da notificação (gerado pelo sistema).
          example: 1042
        created_at:
          type: string
          format: date-time
          description: Data/hora de criação da notificação.
          example: "2026-07-01T10:30:00Z"

PaginatedNotificationList:
  type: object
  properties:
    count:
      type: integer
      description: Total geral de notificações no banco.
      example: 1530
    next:
      type: string
      nullable: true
      description: URL para a próxima página.
      example: "http://localhost:8000/api/v1/notifications?page=2"
    previous:
      type: string
      nullable: true
      description: URL para a página anterior.
      example: null
    results:
      type: array
      items:
        $ref: "#/NotificationResponse"

# --- DENGUE NOTIFICATION SCHEMAS ---
DengueSpecificFields:
  type: object
  properties:
    has_fever:
      type: string
      description: Indica presença de febre.
      example: "yes"
    has_severe_arthralgia:
      type: string
      description: Indica presença de artralgia intensa.
      example: "yes"
    chik_s1_result:
      type: string
      description: Resultado do exame CHIK S1.
      example: "non_reactive"
    ns1_result:
      type: string
      description: Resultado do exame NS1.
      example: "reactive"
    classification_type:
      type: string
      description: Classificação final do caso.
      example: "dengue_with_warning_signs"
    has_shock:
      type: string
      description: Indica presença de choque.
      example: "no"

DengueCreateRequest:
  allOf:
    - $ref: "#/NotificationBase"
    - type: object
      required:
        - notification_type_slug
        - specific_fields
      properties:
        notification_type_slug:
          type: string
          enum: ["dengue"]
          description: Identificador do agravo.
          example: "dengue"
        specific_fields:
          $ref: "#/DengueSpecificFields"
  example:
    patient_id: 55
    unit_id: 12
    status: "draft"
    notification_type_slug: "dengue"
    notification_date: "2026-06-25"
    occurrence_date: "2026-06-20"
    notes: "Paciente internado."
    specific_fields:
      has_fever: "yes"
      has_severe_arthralgia: "yes"
      chik_s1_result: "non_reactive"
      ns1_result: "reactive"
      classification_type: "dengue_with_warning_signs"
      has_shock: "no"

DengueNotificationResponse:
  allOf:
    - $ref: "#/NotificationResponse"
    - type: object
      properties:
        specific_fields:
          $ref: "#/DengueSpecificFields"
  example:
    id: 1042
    patient_id: 55
    unit_id: 12
    user_id: 7
    status: "published"
    notification_type_slug: "dengue"
    notification_date: "2026-06-25"
    occurrence_date: "2026-06-20"
    notes: "Paciente internado."
    created_at: "2026-07-01T10:30:00Z"
    specific_fields:
      has_fever: "yes"
      has_severe_arthralgia: "yes"
      chik_s1_result: "non_reactive"
      ns1_result: "reactive"
      classification_type: "dengue_with_warning_signs"
      has_shock: "no"
