services:
  db:
    image: postgres:15-alpine
    container_name: sinan-postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - sinan_pg_data:/var/lib/postgresql/data
    networks:
      - sinan_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4:7.7
    container_name: sinan-pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - db
    networks:
      - sinan_net
  backend:
    container_name: sinan-backend
    build: 
      context: .
      target: runner 
    command: ["sh", "-c", "node dist/shared/infra/database/drizzle/setup-db.js && node dist/index.js"]
    expose:
      - "8000"
    environment:
      - NODE_ENV=${NODE_ENV}

      # --- DATABASE CONFIG ---
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      # -- JWT CONFIG ---
      - JWT_SECRET=${JWT_SECRET}

      # --- ADMIN USER CONFIG ---
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sinan_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  nginx:
    image: nginx:1.30.4-alpine
    container_name: sinan-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_web:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NGINX_PORT=${NGINX_PORT}
      - NGINX_HOST=${NGINX_HOST}
    networks:
      - sinan_net
  certbot:
    image: certbot/certbot
    container_name: sinan-certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_web:/var/www/certbot
    depends_on:
      - nginx
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  sinan_pg_data:
  certbot_etc:
  certbot_web:

networks:
  sinan_net:
    driver: bridge
